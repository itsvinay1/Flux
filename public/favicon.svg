<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0f2444" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Bolt Glow / Shimmer Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3" />
    </linearGradient>

    <!-- Inner Shadow / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="800 300" opacity="0.85" />

  <!-- Inner Focus Orbit Dots -->
  <circle cx="256" cy="66" r="8" fill="#38bdf8" />
  <circle cx="446" cy="256" r="6" fill="#34d399" />
  <circle cx="256" cy="446" r="6" fill="#0ea5e9" opacity="0.6" />
  <circle cx="66" cy="256" r="6" fill="#38bdf8" opacity="0.6" />

  <!-- Dynamic Precision Focus Lightning / FLUX Symbol -->
  <path d="M 288 88 L 168 256 L 256 256 L 224 424 L 344 256 L 256 256 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linejoin="round"
        stroke-linecap="round" />

  <!-- Central Energy Core Highlight -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
</svg>