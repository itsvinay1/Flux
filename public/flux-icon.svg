<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Top Stem & Bar Gradient -->
    <linearGradient id="fTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Lower Horizontal Bar Gradient -->
    <linearGradient id="fBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Drop Shadow for Layering -->
    <filter id="layerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Rim Glow Border -->
  <rect width="510" height="510" x="1" y="1" rx="119" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />

  <!-- Geometric Layer 1: Top Bar & Full Vertical Pillar -->
  <path d="M 176 128 C 153.9 128 136 145.9 136 168 L 136 364 C 136 377.3 146.7 388 160 388 L 184 388 C 197.3 388 208 377.3 208 364 L 208 196 L 360 196 C 368.8 196 376 188.8 376 180 L 376 144 C 376 135.2 368.8 128 360 128 Z"
        fill="url(#fTopGrad)" />

  <!-- Geometric Layer 2: Precision Chamfered Crossbar (Overlapping with Depth) -->
  <path d="M 136 228 L 312 228 C 320.8 228 328 235.2 328 244 L 328 276 C 328 284.8 320.8 292 312 292 L 208 292 L 208 316 L 136 316 Z"
        fill="url(#fBottomGrad)"
        filter="url(#layerShadow)" />
</svg>